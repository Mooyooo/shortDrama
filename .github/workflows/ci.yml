name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Normally generated by `expo start`; gitignored, but tsc needs it for CSS module types.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx expo lint
      - run: npx tsc --noEmit
